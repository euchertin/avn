<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CRMessenger</title>
<style>
:root{
  --bg:#0e0e10;
  --sidebar:#17171a;
  --list:#1d1d20;
  --chat:#121214;
  --divider:#2a2a2f;
  --me:#3f424a;
  --other:#2a2c33;
  --text:#f0f0f2;
  --muted:#a2a2ad;
  --accent:#3a3a3f;
  --accent-2:#4a4a4f;
  --radius-xl:18px;
  --radius-lg:14px;
  --radius-md:10px;
  --shadow:0 10px 30px rgba(0,0,0,.35);
  --own-accent: linear-gradient(135deg,#3f424a,#50545c);
  --mobile-own: #1e90ff;
  --composer-h:72px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:"Segoe UI", Roboto, system-ui, -apple-system, Arial, sans-serif;
  display:grid;
  grid-template-columns:84px 1fr 320px;
  gap:0;
  height:100vh;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  min-width:0;
}
.sidebar{
  background:var(--sidebar);
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:14px 10px;
  gap:14px;
  box-shadow:var(--shadow);
  position:relative;
  min-width:84px;
}
.side-btn{
  width:56px;height:56px;border-radius:14px;background:#222227;
  display:grid;place-items:center;font-size:22px;cursor:pointer;
  user-select:none;transition:transform .12s ease, background .12s ease;border:1px solid #2b2b30;position:relative;
}
.side-btn:hover{transform:translateY(-4px);background:#26262c}
.side-badge{
  position:absolute;top:6px; right:6px;min-width:18px; height:18px; padding:0 5px;background:#ff4d4d; color:#fff; font-weight:700; font-size:12px;border-radius:999px; display:none; align-items:center; justify-content:center;box-shadow:0 6px 18px rgba(0,0,0,.5);
}
.chat{
  background:var(--chat);
  display:flex;
  flex-direction:column;
  height:100vh;
  position:relative;
  min-width:0;
  width:100%;
  overflow:hidden;
}
.chat-header{
  padding:12px;
  border-bottom:1px solid var(--divider);
  display:flex;
  align-items:center;
  gap:10px;
  justify-content:space-between;
  background:linear-gradient(90deg, rgba(255,255,255,0.01), rgba(0,0,0,0));
}
.header-left{display:flex;align-items:center;gap:12px}
.toggle-rooms{display:none;background:transparent;border:none;color:var(--text);font-size:22px;cursor:pointer}
.chat-title{font-size:18px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:240px}
.chat-sub{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mobile-create{display:none;background:transparent;border:1px solid #2e2e33;color:var(--text);padding:8px 10px;border-radius:10px;cursor:pointer;transition:background .12s}
.messages {
  display:flex;
  flex-direction:column;
  gap:10px;
  padding:18px 18px calc(var(--composer-h) + 20px);
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  flex:1;
  min-height:0;
  width:100%;
  scroll-behavior:smooth;
}
.bubble{
  display:inline-block;
  max-width:72%;
  padding:12px 14px;
  border-radius:16px;
  line-height:1.4;
  position:relative;
  word-wrap:break-word;
  white-space:pre-wrap;
  box-shadow:var(--shadow);
  transition:transform .16s cubic-bezier(.2,.9,.2,1), opacity .16s ease, box-shadow .12s;
  opacity:0;
  transform:translateY(8px);
  will-change:transform, opacity;
}
.bubble.show{opacity:1;transform:none}
.from-me{
  align-self:flex-end;
  background:var(--own-accent);
  color:#eef1f6;
  border-bottom-right-radius:20px;
  box-shadow:0 8px 20px rgba(0,0,0,.45);
  margin-left:12px;
  transform-origin:100% 100%;
}
.from-me:hover{transform:translateY(-4px); box-shadow:0 14px 28px rgba(0,0,0,.5);}
.meta{font-size:11px;color:var(--muted);margin-bottom:8px}
.from-other{
  align-self:flex-start;
  background:linear-gradient(135deg,#232327,#2f3136);
  color:#eef1f6;
  border-bottom-left-radius:20px;
  box-shadow:0 8px 20px rgba(0,0,0,.35);
  margin-right:12px;
}
.from-other:hover{transform:translateY(-3px);}
.message.system, .bubble.system{
  align-self:center;
  background:transparent;
  color:var(--muted);
  font-size:13px;
  box-shadow:none;
  opacity:0.9;
}
.media img{max-width:100%;height:auto;border-radius:12px;display:block;margin-top:8px}
.media audio{width:100%;margin-top:8px}
.composer{
  height:var(--composer-h);
  padding:12px;
  border-top:1px solid var(--divider);
  display:flex;
  gap:8px;
  align-items:center;
  background:#0f1012;
  position:fixed;
  left:0; right:0; bottom:env(safe-area-inset-bottom);
  z-index:10000;
  box-shadow: 0 -8px 30px rgba(0,0,0,.6);
  transition:transform .18s ease, background .12s;
}
.file-preview{display:flex;align-items:center;gap:8px;background:#161619;border-radius:10px;padding:6px 8px;border:1px solid #232326;flex-shrink:0}
.file-preview img{width:56px;height:56px;object-fit:cover;border-radius:8px}
.file-preview .meta{font-size:12px;color:var(--muted)}
.file-preview .remove{background:transparent;border:1px solid #333;color:var(--text);border-radius:8px;padding:6px;cursor:pointer}
.composer .input{
  border-radius:999px;padding:12px 16px;font-size:15px;flex:1;background:#121214;border:1px solid #222224;color:var(--text);outline:none;
  transition:box-shadow .12s, border-color .12s;
}
.composer .input:focus{box-shadow:0 8px 30px rgba(0,0,0,.6);border-color:#2f3338}
.btn{border:none;border-radius:12px;padding:10px 12px;background:var(--accent);color:#0b0b0c;cursor:pointer;font-weight:600;transition:transform .12s, background .12s;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.btn:hover{transform:translateY(-3px);background:var(--accent-2)}
.btn.send{width:48px;height:48px;border-radius:999px;background:linear-gradient(135deg,#2ea6ff,#1673d6);color:#fff;display:grid;place-items:center;padding:0}
.btn.send svg{display:block;line-height:0}
.list{
  background:var(--list);
  border-left:1px solid var(--divider);
  display:flex;
  flex-direction:column;
  overflow:hidden;
  min-width:260px;
  max-width:360px;
}
.list-header{padding:12px;border-bottom:1px solid var(--divider);display:flex;flex-direction:column;gap:8px}
.field{display:flex;gap:8px;align-items:center}
.input{border:none;outline:none;border-radius:12px;padding:10px 12px;background:#202026;color:var(--text);font-size:14px}
.rooms{overflow:auto;padding:8px}
.room-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;cursor:pointer;user-select:none;transition:background .12s,border-color .12s;border:1px solid transparent;position:relative}
.room-item:hover{background:#24242a;border-color:#2e2e36}
.room-item.active{background:#2a2a31;border-color:#33333b}
.room-avatar{width:40px;height:40px;border-radius:10px;background:#2b2b33;display:grid;place-items:center;color:#cfd8ff;font-weight:700;font-size:14px;border:1px solid #34343c}
.room-title{font-weight:700;font-size:14px}
.room-sub{font-size:12px;color:var(--muted)}
.leave-btn{background:transparent;border:1px solid #333;color:var(--text);border-radius:8px;padding:6px 8px;cursor:pointer}
.new-msg-badge{position:absolute;top:8px;right:48px;min-width:20px;height:20px;padding:0 6px;background:#ff4d4d;color:#fff;border-radius:999px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.rooms-overlay-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:1400;opacity:0;transition:opacity .18s ease}
.rooms-overlay{display:none;position:fixed;top:0;bottom:0;right:0;width:80%;max-width:360px;background:var(--list);z-index:1500;box-shadow:-8px 0 30px rgba(0,0,0,.5);transform:translateX(100%);transition:transform .22s cubic-bezier(.2,.9,.2,1);overflow:auto}
.rooms-overlay-backdrop.show{display:block;opacity:1}
.rooms-overlay.open{display:block;transform:translateX(0)}
.messages::-webkit-scrollbar,.rooms::-webkit-scrollbar{width:10px}
.messages::-webkit-scrollbar-thumb,.rooms::-webkit-scrollbar-thumb{background:#3a3a44;border-radius:10px}
@media (max-width:1000px){
  body{grid-template-columns:1fr;min-width:0}
  .sidebar{display:none !important}
  .list{display:none !important}
  .toggle-rooms{display:inline-block}
  .mobile-create{display:inline-flex}
  :root{
    --own-accent: linear-gradient(135deg,var(--mobile-own),#1673d6);
    --chat:#09090b;
    --bg:#08090a;
    --text:#f7f9fb;
    --other:#1f2326;
  }
  .chat-header{padding:10px 12px}
  .chat-title{font-size:18px;max-width:calc(100% - 180px)}
  .chat-sub{font-size:12px;color:var(--muted)}
  .messages{padding:12px 12px calc(var(--composer-h) + 16px);gap:10px}
  .bubble{max-width:85%;padding:12px 14px;border-radius:16px;font-size:16px;transition:transform .16s ease,opacity .16s ease;word-wrap:break-word;overflow-wrap:break-word}
  .from-me{ align-self:flex-end; margin-left:18px; }
  .from-other{ align-self:flex-start; margin-right:18px; }
  .composer{position:fixed;left:0;right:0;bottom:env(safe-area-inset-bottom);padding:12px;display:flex;gap:8px;align-items:center;background: linear-gradient(180deg,#060606,#0c0c0d);border-top-left-radius:16px;border-top-right-radius:16px;z-index:1600;box-shadow:0 -8px 30px rgba(0,0,0,.6)}
  .composer .input{flex:1;font-size:16px;padding:12px 14px;border-radius:14px;background:#0b0c0d;border:1px solid #151617;color:var(--text)}
  .btn{padding:10px 14px;border-radius:14px}
  .file-preview img{width:48px;height:48px;border-radius:10px}
  .rooms-overlay{width:86%}
  .rooms{padding:8px 6px}
  .room-avatar{width:36px;height:36px}
  .room-title{font-size:13px}
  .room-sub{font-size:11px}
  .fab-create {position:fixed;left:14px;bottom:calc(var(--composer-h) + 18px);z-index:1650;width:52px;height:52px;border-radius:999px;display:flex;align-items:center;justify-content:center;background:var(--mobile-own);color:#fff;font-weight:700;border:none;box-shadow:0 8px 24px rgba(0,0,0,.5);cursor:pointer}
}
@media (max-width:600px){
  .bubble{max-width:92%;padding:10px 12px;border-radius:14px;font-size:15px}
  .from-me{margin-left:12px}
  .from-other{margin-right:12px}
  .composer{padding:10px}
  .composer .input{font-size:15px;padding:10px 12px}
  .file-preview img{width:44px;height:44px}
  .toggle-rooms{font-size:20px}
}
.hidden{display:none !important}
.center{display:flex;align-items:center;justify-content:center}
.msg-controls{position:absolute;top:6px;right:8px;display:flex;gap:6px;opacity:0;transition:opacity .12s}
.bubble:hover .msg-controls{opacity:1}
.msg-btn{background:transparent;border:none;color:var(--text);padding:6px;border-radius:8px;cursor:pointer;font-size:14px}
.msg-btn:hover{background:rgba(255,255,255,0.03)}
</style>
</head>
<body>
<aside class="sidebar" aria-hidden="true">
  <div class="side-btn" id="btnHome" title="Домой">🏠<div class="side-badge" id="totalUnread">0</div></div>
  <div class="side-btn" id="btnCreate" title="Создать комнату">➕</div>
  <div class="side-btn" id="btnSettings" title="Ник / настройки">⚙️</div>
</aside>
<main class="chat" role="main">
  <div class="chat-header">
    <div class="header-left">
      <button class="toggle-rooms" id="toggleRoomsBtn" title="Комнаты">☰</button>
      <div style="display:flex;flex-direction:column">
        <div class="chat-title" id="roomTitle">Выберите комнату</div>
        <div class="chat-sub" id="roomSub">Код не выбран</div>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:8px">
      <div class="chip" id="shareCode" style="display:none;cursor:pointer;font-size:13px;padding:6px 10px;border-radius:10px;background:#1f2123;border:1px solid rgba(255,255,255,0.02)"></div>
      <button class="mobile-create" id="mobileCreateBtn" title="Создать комнату">➕ Комната</button>
    </div>
  </div>

  <div class="messages" id="messages" aria-live="polite"></div>

  <div class="composer" id="composer">
    <div id="filePreviewContainer" style="display:none"></div>
    <input class="input" id="msgInput" placeholder="Сообщение... (Enter — отправить)" />
    <input type="file" id="filePicker" accept="image/*,audio/*" hidden />
    <button class="btn" id="attachBtn" title="Прикрепить">📎</button>
    <button class="btn send" id="sendBtn" title="Отправить" aria-label="Send">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="white" style="transform:rotate(45deg)"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
    </button>
  </div>

  <button id="fabCreate" class="fab-create hidden">➕</button>
</main>
<section class="list" id="desktopList">
  <div class="list-header">
    <div style="display:flex;gap:8px">
      <input class="input" id="nickname" placeholder="Ваш ник (по умолчанию: Гость)" style="flex:1" />
      <button class="btn" id="saveNick">OK</button>
    </div>
    <div style="display:flex;gap:8px;align-items:center">
      <input class="input" id="joinCode" placeholder="Код комнаты: ABC123" style="text-transform:uppercase;flex:1" />
      <button class="btn" id="joinBtn">Войти</button>
    </div>
  </div>
  <div class="rooms" id="rooms"></div>
</section>
<div class="rooms-overlay-backdrop" id="roomsBackdrop" aria-hidden="true"></div>
<section class="rooms-overlay" id="roomsOverlay" aria-hidden="true">
  <div style="padding:12px;border-bottom:1px solid rgba(255,255,255,0.03);display:flex;gap:8px;align-items:center">
    <button class="btn" id="closeRoomsMobile">←</button>
    <div style="flex:1;font-weight:700">Комнаты</div>
    <button class="btn" id="mobileLoadSaved">Загрузить</button>
  </div>
  <div style="padding:12px" id="roomsOverlayContent">
    <div style="display:flex;gap:8px;margin-bottom:10px">
      <input class="input" id="nickname_mobile" placeholder="Ник" style="flex:1" />
      <button class="btn" id="saveNick_mobile">OK</button>
    </div>
    <div style="display:flex;gap:8px;margin-bottom:10px">
      <input class="input" id="joinCode_mobile" placeholder="Код комнаты: ABC123" style="text-transform:uppercase;flex:1" />
      <button class="btn" id="joinBtn_mobile">Войти</button>
    </div>
    <div class="rooms" id="roomsMobileList" style="padding:0"></div>
  </div>
</section>

<script type="module">
import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/11.8.1/firebase-app.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.8.1/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc, serverTimestamp, collection, addDoc, query, orderBy, onSnapshot, limit, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/11.8.1/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/11.8.1/firebase-storage.js";
const firebaseConfig = { apiKey:"AIzaSyBtcsiDCvGMBHoNKd7CxrS9w6zG0wnNzIc", authDomain:"messagecr-1e301.firebaseapp.com", projectId:"messagecr-1e301", storageBucket:"messagecr-1e301.appspot.com", messagingSenderId:"498943600919", appId:"1:498943600919:web:b0cc23f1f4a91fac52af52" };
if(!getApps().length) initializeApp(firebaseConfig);
const auth = getAuth();
const db = getFirestore();
const storage = getStorage();
const roomsEl = document.getElementById('rooms');
const roomsMobileList = document.getElementById('roomsMobileList');
const roomsOverlay = document.getElementById('roomsOverlay');
const roomsBackdrop = document.getElementById('roomsBackdrop');
const toggleRoomsBtn = document.getElementById('toggleRoomsBtn');
const closeRoomsMobile = document.getElementById('closeRoomsMobile');
const mobileLoadSaved = document.getElementById('mobileLoadSaved');
const roomTitle = document.getElementById('roomTitle');
const roomSub = document.getElementById('roomSub');
const shareCode = document.getElementById('shareCode');
const messagesEl = document.getElementById('messages');
const msgInput = document.getElementById('msgInput');
const sendBtn = document.getElementById('sendBtn');
const filePicker = document.getElementById('filePicker');
const attachBtn = document.getElementById('attachBtn');
const filePreviewContainer = document.getElementById('filePreviewContainer');
const joinCodeInput = document.getElementById('joinCode');
const joinBtn = document.getElementById('joinBtn');
const btnCreate = document.getElementById('btnCreate');
const nicknameInput = document.getElementById('nickname');
const saveNickBtn = document.getElementById('saveNick');
const nicknameInputMobile = document.getElementById('nickname_mobile');
const saveNickBtnMobile = document.getElementById('saveNick_mobile');
const joinCodeMobile = document.getElementById('joinCode_mobile');
const joinBtnMobile = document.getElementById('joinBtn_mobile');
const totalUnreadEl = document.getElementById('totalUnread');
const mobileCreateBtn = document.getElementById('mobileCreateBtn');
const fabCreate = document.getElementById('fabCreate');
let user = null;
onAuthStateChanged(auth, async (u) => {
  if (!u) await signInAnonymously(auth);
  else { user = u; renderRoomsList(); syncMobileNick(); updateMobileUIButtons(); }
});
window.addEventListener('resize', updateMobileUIButtons);
function updateMobileUIButtons(){
  const isMobile = window.matchMedia('(max-width:1000px)').matches;
  if(isMobile){ mobileCreateBtn.style.display='inline-flex'; fabCreate.classList.remove('hidden'); }
  else { mobileCreateBtn.style.display='none'; fabCreate.classList.add('hidden'); }
}
let nickname = localStorage.getItem('crm_nick') || 'Гость';
nicknameInput.value = nickname; nicknameInputMobile.value = nickname; saveNickBtn.onclick = saveNick; saveNickBtnMobile.onclick = saveNick;
function saveNick(){ nickname = (nicknameInput.value || nicknameInputMobile.value || 'Гость').trim().slice(0,32); nicknameInput.value = nickname; nicknameInputMobile.value = nickname; localStorage.setItem('crm_nick', nickname); }
let currentRoom = null;
let unsubMessages = null;
let myRooms = JSON.parse(localStorage.getItem('crm_myRooms') || '[]');
const roomWatchers = {};
function randCode(len=6){ const alphabet='ABCDEFGHJKMNPQRSTUVWXYZ23456789'; let out=''; crypto.getRandomValues(new Uint32Array(len)).forEach(n=> out+=alphabet[n%alphabet.length]); return out; }
function escapeHtml(s){ if(!s && s!==0) return ''; return String(s).replace(/[&<>\"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[m])); }
function fmtTime(ts){ try{ const d = new Date(ts); return d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}); }catch(e){ return ''; } }
function ensureRoomWatcher(code){
  if(roomWatchers[code]) return;
  try{
    const q = query(collection(db,'rooms',code,'messages'), orderBy('t','desc'), limit(1));
    const unsub = onSnapshot(q, (snap) => {
      snap.forEach(d => {
        const m = d.data();
        const room = myRooms.find(r => r.code === code);
        if(!room) return;
        const msgTs = m.t && typeof m.t.toMillis === 'function' ? m.t.toMillis() : Date.now();
        if(currentRoom === code){ room.lastSeen = msgTs; room.lastMsg = msgTs; persistMyRooms(); return; }
        if(m.uid !== user?.uid && (!room.lastSeen || msgTs > room.lastSeen)){
          room.unreadCount = (room.unreadCount || 0) + 1;
          room.lastMsg = msgTs;
          persistMyRooms(); renderRoomsList();
        }
      });
    });
    roomWatchers[code] = unsub;
  }catch(e){ console.warn('watcher err', e); }
}
function stopAllWatchers(){ Object.keys(roomWatchers).forEach(k=>{ try{ roomWatchers[k](); }catch(e){} }); }
function renderRoomsList(){
  const total = myRooms.reduce((s,r)=> s + (r.unreadCount||0), 0);
  if(total>0){ totalUnreadEl.style.display='flex'; totalUnreadEl.textContent = total>99?'99+':String(total); } else totalUnreadEl.style.display='none';
  roomsEl.innerHTML=''; myRooms.forEach(room=>{
    ensureRoomWatcher(room.code);
    const div = document.createElement('div');
    div.className = 'room-item' + (currentRoom===room.code?' active':'');
    div.innerHTML = `
      <div class="room-avatar">${escapeHtml((room.name||room.code).slice(0,2).toUpperCase())}</div>
      <div style="flex:1">
        <div class="room-title" style="font-weight:700">${escapeHtml(room.name||('Комната '+room.code))}</div>
        <div class="room-sub" style="color:var(--muted);font-size:12px">Код: ${escapeHtml(room.code)}</div>
      </div>
      ${room.unreadCount?`<div class="new-msg-badge">${room.unreadCount>99?'99+':room.unreadCount}</div>`:''}
      <button class="leave-btn" data-code="${escapeHtml(room.code)}" title="Удалить">✕</button>`;
    div.querySelector('.room-avatar').onclick = ()=> openRoom(room.code, room.name || ('Комната '+room.code));
    div.onclick = (e)=>{ if(e.target && e.target.classList && e.target.classList.contains('leave-btn')) return; openRoom(room.code, room.name || ('Комната '+room.code)); };
    roomsEl.appendChild(div);
    const leaveBtn = div.querySelector('.leave-btn');
    leaveBtn.onclick = (ev)=>{ ev.stopPropagation(); removeFromMyRooms(leaveBtn.dataset.code); };
  });
  roomsMobileList.innerHTML=''; myRooms.forEach(room=>{
    const div = document.createElement('div');
    div.className = 'room-item' + (currentRoom===room.code?' active':'');
    div.style.marginBottom='6px';
    div.innerHTML = `
      <div class="room-avatar">${escapeHtml((room.name||room.code).slice(0,2).toUpperCase())}</div>
      <div style="flex:1">
        <div class="room-title" style="font-weight:700">${escapeHtml(room.name||('Комната '+room.code))}</div>
        <div class="room-sub" style="color:var(--muted);font-size:12px">Код: ${escapeHtml(room.code)}</div>
      </div>
      ${room.unreadCount?`<div class="new-msg-badge">${room.unreadCount>99?'99+':room.unreadCount}</div>`:''}
      <button class="leave-btn" data-code="${escapeHtml(room.code)}" title="Удалить">✕</button>`;
    div.onclick = (e)=>{ if(e.target && e.target.classList && e.target.classList.contains('leave-btn')) return; openRoom(room.code, room.name || ('Комната '+room.code)); closeRoomsOverlay(); };
    roomsMobileList.appendChild(div);
    const leaveBtn = div.querySelector('.leave-btn');
    leaveBtn.onclick = (ev)=>{ ev.stopPropagation(); removeFromMyRooms(leaveBtn.dataset.code); };
  });
}
async function persistMyRooms(){
  try{ localStorage.setItem('crm_myRooms', JSON.stringify(myRooms)); }
  catch(e){ console.warn('localStorage err', e); }
  if(!user) return;
  try{
    const userDoc = doc(db, 'userRooms', user.uid);
    await setDoc(userDoc, { rooms: myRooms }, { merge: true });
  }catch(err){ console.warn('persist err', err); }
}
async function removeFromMyRooms(code){
  myRooms = myRooms.filter(r=> r.code !== code);
  if(roomWatchers[code]){ try{ roomWatchers[code](); }catch(e){} delete roomWatchers[code]; }
  await persistMyRooms(); renderRoomsList();
  if(currentRoom === code){
    currentRoom = null; messagesEl.innerHTML = ''; roomTitle.textContent='Выберите комнату'; roomSub.textContent='Код не выбран'; shareCode.style.display='none';
    if(unsubMessages){ unsubMessages(); unsubMessages=null; }
  }
}
async function loadMyRoomsFromFirestore(){
  if(!user) return alert('Сначала дождитесь авторизации');
  try{
    const userDoc = doc(db, 'userRooms', user.uid);
    const snap = await getDoc(userDoc);
    if(!snap.exists()) return alert('Сохранённых комнат не найдено');
    const data = snap.data();
    if(Array.isArray(data.rooms)){
      myRooms = data.rooms.map(r=>({ code: r.code, name: r.name || ('Комната '+r.code), unreadCount: r.unreadCount||0, lastSeen: r.lastSeen||0 }));
      await persistMyRooms(); renderRoomsList(); alert('Сохранённые комнаты загружены');
    } else alert('Сохранённых комнат нет');
  }catch(err){ console.error(err); alert('Ошибка при загрузке'); }
}
async function addToMyRooms(code,name){ if(!myRooms.find(r=> r.code===code)){ myRooms.push({ code, name, unreadCount:0, lastSeen: Date.now() }); await persistMyRooms(); renderRoomsList(); } }
btnCreate.onclick = async ()=> createRoomFlow(); mobileCreateBtn.onclick = async ()=> createRoomFlow(); fabCreate.onclick = async ()=> createRoomFlow();
async function createRoomFlow(){ if(!user) return alert('Подождите авторизации...'); const code = randCode(); const roomRef = doc(db,'rooms',code); await setDoc(roomRef, { createdAt: serverTimestamp(), name: 'Комната '+code, active:true, creator:user.uid }); await addDoc(collection(roomRef,'messages'), { t: serverTimestamp(), uid: user.uid, name: nickname, text: `👋 ${nickname} создал(а) комнату`, sys:true }); await addToMyRooms(code, 'Комната '+code); openRoom(code,'Комната '+code); }
joinBtn.onclick = async ()=> { const code=(joinCodeInput.value||'').trim().toUpperCase(); if(!code) return; await joinRoomByCode(code); };
joinBtnMobile.onclick = async ()=> { const code=(joinCodeMobile.value||'').trim().toUpperCase(); if(!code) return; await joinRoomByCode(code); };
async function joinRoomByCode(code){
  try{
    const roomRef = doc(db, 'rooms', code);
    const snap = await getDoc(roomRef);
    if(!snap.exists()){ alert('Комната не найдена'); return; }
    const name = snap.data().name || ('Комната ' + code);
    await addToMyRooms(code, name);
    openRoom(code, name);
  }catch(e){ console.error(e); alert('Ошибка при присоединении'); }
}
function openRoom(code,name){
  currentRoom = code; roomTitle.textContent = name; roomSub.textContent = 'Код: ' + code;
  shareCode.style.display='inline-block'; shareCode.textContent = 'Поделиться кодом: ' + code;
  shareCode.onclick = ()=> navigator.clipboard?.writeText(code).then(()=>{ const prev = shareCode.textContent; shareCode.textContent='Скопировано!'; setTimeout(()=>shareCode.textContent = prev,1200); }).catch(()=>alert('Не удалось скопировать'));
  const roomObj = myRooms.find(r=> r.code===code);
  if(roomObj){ roomObj.unreadCount = 0; persistMyRooms(); renderRoomsList(); }
  if(unsubMessages){ unsubMessages(); unsubMessages=null; }
  const qMsgs = query(collection(db, 'rooms', code, 'messages'), orderBy('t','asc'));
  unsubMessages = onSnapshot(qMsgs, (snap)=>{
    messagesEl.innerHTML = '';
    snap.forEach(d => renderMessage(d.id, d.data()));
    requestAnimationFrame(()=> messagesEl.scrollTo({ top: messagesEl.scrollHeight, behavior: 'smooth' }));
    const lastDoc = snap.docs[snap.docs.length-1];
    if(lastDoc){
      const m = lastDoc.data();
      const ts = m.t && typeof m.t.toMillis === 'function' ? m.t.toMillis() : Date.now();
      const r = myRooms.find(rr => rr.code === code);
      if(r){ r.lastSeen = ts; r.lastMsg = ts; persistMyRooms(); renderRoomsList(); }
    }
  }, err => console.warn('msgs err', err));
}
function renderMessage(id,m){
  const wrap = document.createElement('div');
  const mine = (m.uid === user?.uid);
  if(m.sys){ wrap.className = 'system'; wrap.textContent = m.text || ''; messagesEl.appendChild(wrap); return; }
  wrap.className = 'bubble ' + (mine ? 'from-me' : 'from-other');
  wrap.dataset.id = id;
  const timeHtml = m.t ? `<span style="float:right;color:var(--muted);font-size:11px">${fmtTime((m.t && typeof m.t.toMillis === 'function')?m.t.toMillis():Date.now())}</span>` : '';
  const metaHTML = `<div class="meta">${mine? 'Вы' : escapeHtml(m.name || 'Гость')} ${timeHtml}</div>`;
  const textHTML = m.text ? `<div class="msg-text">${escapeHtml(m.text).replace(/\n/g,'<br/>')}</div>` : '';
  const mediaHTML = m.url ? `<div class="media">${ m.type?.startsWith('audio') ? `<audio controls src="${m.url}"></audio>` : `<img src="${m.url}" alt="media" />` }</div>` : '';
  const controlsHTML = mine ? `<div class="msg-controls"><button class="msg-btn edit" title="Редактировать">✏️</button><button class="msg-btn del" title="Удалить">🗑️</button></div>` : '';
  wrap.innerHTML = metaHTML + textHTML + mediaHTML + controlsHTML;
  messagesEl.appendChild(wrap);
  requestAnimationFrame(()=> wrap.classList.add('show'));
  if(mine){
    const editBtn = wrap.querySelector('.edit');
    const delBtn = wrap.querySelector('.del');
    editBtn.onclick = ()=> startEditMessage(wrap, id, m);
    delBtn.onclick = ()=> deleteMessage(wrap, id);
  }
}
async function startEditMessage(wrap, id, m){
  const txtEl = wrap.querySelector('.msg-text');
  if(!txtEl) return;
  const original = m.text || '';
  const ta = document.createElement('textarea');
  ta.value = original;
  ta.style.width = '100%';
  ta.style.borderRadius = '10px';
  ta.style.padding = '8px';
  ta.style.marginTop = '6px';
  txtEl.replaceWith(ta);
  const controls = wrap.querySelector('.msg-controls');
  controls.innerHTML = `<button class="msg-btn save">Сохранить</button><button class="msg-btn cancel">Отмена</button>`;
  const saveBtn = controls.querySelector('.save');
  const cancelBtn = controls.querySelector('.cancel');
  cancelBtn.onclick = ()=>{ ta.replaceWith(createTextDiv(original)); controls.innerHTML = `<button class="msg-btn edit">✏️</button><button class="msg-btn del">🗑️</button>`; wrap.querySelector('.edit').onclick = ()=> startEditMessage(wrap,id,m); wrap.querySelector('.del').onclick = ()=> deleteMessage(wrap,id); };
  saveBtn.onclick = async ()=>{
    const newText = ta.value.trim();
    try{
      await updateDoc(doc(db, 'rooms', currentRoom, 'messages', id), { text: newText, edited: true });
      ta.replaceWith(createTextDiv(newText));
      controls.innerHTML = `<button class="msg-btn edit">✏️</button><button class="msg-btn del">🗑️</button>`;
      wrap.querySelector('.edit').onclick = ()=> startEditMessage(wrap,id,Object.assign({},m,{text:newText}));
      wrap.querySelector('.del').onclick = ()=> deleteMessage(wrap,id);
    }catch(e){ console.error('update err', e); alert('Ошибка при сохранении'); }
  };
}
function createTextDiv(text){ const d = document.createElement('div'); d.className = 'msg-text'; d.innerHTML = escapeHtml(text).replace(/\n/g,'<br/>'); return d; }
async function deleteMessage(wrap,id){ if(!confirm('Удалить сообщение?')) return; try{ await deleteDoc(doc(db, 'rooms', currentRoom, 'messages', id)); wrap.remove(); }catch(e){ console.error('delete err', e); alert('Ошибка при удалении'); } }
sendBtn.onclick = sendText;
msgInput.addEventListener('keydown', (e)=>{ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); sendText(); } });
async function sendText(){ if(!currentRoom) return alert('Сначала выберите комнату'); const text = msgInput.value.trim(); if(!text && !msgInput._pendingFile) return; if(msgInput._pendingFile){ const f = msgInput._pendingFile; try{ const fileRef = ref(storage, `uploads/${currentRoom}/${Date.now()}_${f.name}`); await uploadBytes(fileRef, f, { contentType: f.type }); const url = await getDownloadURL(fileRef); await addDoc(collection(db, 'rooms', currentRoom, 'messages'), { t: serverTimestamp(), uid: user?.uid || null, name: nickname, url, type: f.type }); }catch(e){ console.error('upload err', e); alert('Ошибка загрузки файла'); } msgInput._pendingFile = null; hideFilePreview(); }
  if(text){ try{ await addDoc(collection(db, 'rooms', currentRoom, 'messages'), { t: serverTimestamp(), uid: user?.uid || null, name: nickname, text }); msgInput.value = ''; }catch(e){ console.error('send err', e); alert('Ошибка отправки'); } }
}
attachBtn.onclick = ()=> filePicker.click();
filePicker.onchange = (e)=> { const f = e.target.files?.[0]; if(f){ msgInput._pendingFile = f; showFilePreview(f); } filePicker.value=''; };
msgInput.addEventListener('paste', (e)=>{
  const items = e.clipboardData?.items || [];
  for(const item of items){
    if(item.type && item.type.startsWith('image/')){
      const f = item.getAsFile();
      if(f){ msgInput._pendingFile = f; showFilePreview(f); }
    } else if(item.type === 'text/plain'){
      const t = e.clipboardData.getData('text/plain');
      if(t.trim()) msgInput.value += t;
    }
  }
});
function showFilePreview(file){ if(!file) return hideFilePreview(); filePreviewContainer.innerHTML=''; filePreviewContainer.style.display='block'; const wrapper = document.createElement('div'); wrapper.className='file-preview'; if(file.type.startsWith('image/')){ const img = document.createElement('img'); img.src = URL.createObjectURL(file); img.onload = ()=> URL.revokeObjectURL(img.src); img.style.width='56px'; img.style.height='56px'; img.style.borderRadius='10px'; wrapper.appendChild(img); const meta = document.createElement('div'); meta.className='meta'; meta.innerHTML = `<div style="font-weight:700">${escapeHtml(file.name)}</div><div style="color:var(--muted);font-size:12px">${Math.round(file.size/1024)} KB</div>`; wrapper.appendChild(meta); } else { const meta = document.createElement('div'); meta.className='meta'; meta.innerHTML = `<div style="font-weight:700">${escapeHtml(file.name)}</div><div style="color:var(--muted);font-size:12px">${Math.round(file.size/1024)} KB</div>`; wrapper.appendChild(meta); }
  const remove = document.createElement('button'); remove.className='remove'; remove.textContent='Удалить'; remove.onclick = (e)=>{ e.stopPropagation(); msgInput._pendingFile = null; hideFilePreview(); };
  wrapper.appendChild(remove);
  filePreviewContainer.appendChild(wrapper);
}
function hideFilePreview(){ filePreviewContainer.innerHTML=''; filePreviewContainer.style.display='none'; }
toggleRoomsBtn.onclick = ()=> openRoomsOverlay();
closeRoomsMobile.onclick = ()=> closeRoomsOverlay();
roomsBackdrop.onclick = ()=> closeRoomsOverlay();
function openRoomsOverlay(){ roomsOverlay.classList.add('open'); roomsBackdrop.classList.add('show'); roomsOverlay.setAttribute('aria-hidden','false'); roomsBackdrop.setAttribute('aria-hidden','false'); renderRoomsList(); }
function closeRoomsOverlay(){ roomsOverlay.classList.remove('open'); roomsBackdrop.classList.remove('show'); roomsOverlay.setAttribute('aria-hidden','true'); roomsBackdrop.setAttribute('aria-hidden','true'); }
const btnLoadSaved = document.getElementById('btnLoadSaved');
btnLoadSaved?.addEventListener && btnLoadSaved.addEventListener('click', async ()=> { await loadMyRoomsFromFirestore(); });
mobileLoadSaved?.addEventListener && mobileLoadSaved.addEventListener('click', async ()=> { await loadMyRoomsFromFirestore(); closeRoomsOverlay(); });
renderRoomsList();
syncMobileNick();
function syncMobileNick(){ nicknameInputMobile.value = nicknameInput.value = localStorage.getItem('crm_nick') || 'Гость'; }
window.addEventListener('beforeunload', ()=>{ stopAllWatchers(); if(unsubMessages) try{ unsubMessages(); }catch(e){} });
</script>
